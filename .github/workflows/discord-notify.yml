name: Discord Commit Notifier

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"content\": \"🔥 <@&1521965623322607618> Osiris' Realm git-update!\n\n📦 Repo: ${{ github.repository }}\n👤 Author: ${{ github.actor }}\n📝 Commit: ${{ github.event.head_commit.message }}\n🔗 https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",
            \"allowed_mentions\": {
              \"parse\": [],
              \"roles\": [\"1521965623322607618\"]
            }
          }" \
          ${{ secrets.OSIRIS_WEBHOOK }}